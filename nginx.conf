# ShowCV Nginx 反向代理示例
# 用法：sudo cp nginx.conf /etc/nginx/sites-available/showcv
#       sudo sed -i 's/your-domain.com/你的域名或IP/' /etc/nginx/sites-available/showcv
#       sudo ln -s /etc/nginx/sites-available/showcv /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

# 速率限制区域（与 Express 层 rate limer 形成双重防护）
limit_req_zone $binary_remote_addr zone=share_create:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ai_optimize:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;

server {
    listen 80;
    server_name your-domain.com;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/event-stream;
    gzip_min_length 1024;

    # 健康检查（不记日志）
    location /health {
        proxy_pass http://127.0.0.1:3070;
        access_log off;
    }

    # SSE 端点：禁用 buffer，HTTP/1.1 + Connection 清空（关键）
    # 缺少 proxy_http_version 1.1 会导致 SSE 在第一个事件后挂起
    location /api/ai/optimize {
        limit_req zone=ai_optimize burst=5 nodelay;
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CORS — 生产环境建议替换为固定域名（如 https://your-domain.com）
        # $scheme://$server_name 基于配置的 server_name，不会反射请求中的 Host 头
        add_header Access-Control-Allow-Origin $scheme://$server_name always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # 分享创建端点：独立速率限制
    location /api/share/create {
        limit_req zone=share_create burst=5 nodelay;
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin $scheme://$server_name always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # 其他 API（含分享获取）
    location /api/ {
        limit_req zone=api_general burst=10 nodelay;
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin $scheme://$server_name always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # 静态资源缓存
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 前端
    location / {
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
